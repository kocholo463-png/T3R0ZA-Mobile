name: Build T3R0ZA Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project archive
        run: unzip -q T3R0ZA-Mobile-full-project.zip

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK
        run: sdkmanager "platforms;android-37" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Build debug APK
        working-directory: T3R0ZA-Mobile/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: T3R0ZA-debug
          path: T3R0ZA-Mobile/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
